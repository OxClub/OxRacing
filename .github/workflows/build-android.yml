name: Build OxRacing Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.5.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          godot --version
          java -version || true
          echo "JAVA_HOME=$JAVA_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Install required Linux packages
        run: |
          apt-get update
          apt-get install -y fontconfig

      - name: Install Android export templates
        run: |
          mkdir -p /github/home/.local/share/godot/export_templates/4.5.1.stable

          curl -L \
            https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz \
            -o /tmp/templates.tpz

          mkdir -p /tmp/godot_templates
          unzip -o /tmp/templates.tpz -d /tmp/godot_templates

          cp /tmp/godot_templates/templates/android_debug.apk \
            /github/home/.local/share/godot/export_templates/4.5.1.stable/android_debug.apk

          cp /tmp/godot_templates/templates/android_release.apk \
            /github/home/.local/share/godot/export_templates/4.5.1.stable/android_release.apk

      - name: Configure Java
        run: |
          if [ -z "$JAVA_HOME" ]; then
            JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(which java)")")")"
            export JAVA_HOME
          fi

          echo "JAVA_HOME=$JAVA_HOME"

      - name: Configure Android SDK
        run: |
          if [ -z "$ANDROID_HOME" ] && [ -d "/opt/android-sdk" ]; then
            export ANDROID_HOME="/opt/android-sdk"
          fi

          if [ -z "$ANDROID_SDK_ROOT" ] && [ -n "$ANDROID_HOME" ]; then
            export ANDROID_SDK_ROOT="$ANDROID_HOME"
          fi

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Validate project
        run: |
          godot --headless --editor --quit --path .

      - name: Build Android APK
        run: |
          mkdir -p build

          godot --headless \
            --path . \
            --export-debug "Android" \
            build/OxRacing-debug.apk

      - name: Verify APK
        run: |
          ls -lh build/OxRacing-debug.apk
          file build/OxRacing-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OxRacing-debug-apk
          path: build/OxRacing-debug.apk
          if-no-files-found: error
          retention-days: 14
