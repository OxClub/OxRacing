name: Build OxRacing Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build OxRacing Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip fontconfig openjdk-17-jdk

      - name: Configure Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          "$JAVA_HOME_17_X64/bin/java" -version

      - name: Configure Android SDK
        shell: bash
        run: |
          SDK="/usr/local/lib/android/sdk"

          if [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK not found at $SDK"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          test -d "$SDK/platforms/android-33"
          test -d "$SDK/build-tools/33.0.2"

          echo "Android SDK OK"
          echo "SDK=$SDK"

      - name: Download Godot
        shell: bash
        run: |
          curl -fL \
            "https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip

          mkdir -p "$HOME/godot"

          unzip -o /tmp/godot.zip -d "$HOME/godot"

          GODOT_BIN="$HOME/godot/Godot_v4.5.1-stable_linux.x86_64"

          test -f "$GODOT_BIN"

          chmod +x "$GODOT_BIN"

          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

          "$GODOT_BIN" --version

      - name: Install Godot Android templates
        shell: bash
        run: |
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.5.1.stable"

          mkdir -p "$TEMPLATE_DIR"

          curl -fL \
            "https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz" \
            -o /tmp/templates.tpz

          rm -rf /tmp/godot_templates
          mkdir -p /tmp/godot_templates

          unzip -o /tmp/templates.tpz -d /tmp/godot_templates

          cp /tmp/godot_templates/templates/android_debug.apk \
            "$TEMPLATE_DIR/android_debug.apk"

          cp /tmp/godot_templates/templates/android_release.apk \
            "$TEMPLATE_DIR/android_release.apk"

          echo "Godot Android templates:"
          ls -lh "$TEMPLATE_DIR"

      - name: Configure Godot Android paths and debug signing
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          mkdir -p "$HOME/.android"

          DEBUG_KEYSTORE="$HOME/.android/debug.keystore"

          "$JAVA_HOME_17_X64/bin/keytool" \
            -genkeypair \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 9999 \
            -keystore "$DEBUG_KEYSTORE" \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -deststoretype pkcs12

          test -f "$DEBUG_KEYSTORE"

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$DEBUG_KEYSTORE" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

                    cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF2
          [gd_resource type="EditorSettings" format=3]
          
          [resource]
          
          export/android/java_sdk_path = "$JAVA_HOME_17_X64"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$DEBUG_KEYSTORE"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF2

          echo "Godot Editor Settings:"
          cat "$HOME/.config/godot/editor_settings-4.tres"

          echo "Debug keystore:"
          "$JAVA_HOME_17_X64/bin/keytool" -list -keystore "$DEBUG_KEYSTORE" -storepass android

      - name: Check Godot project
        shell: bash
        run: |
          "$GODOT_BIN" \
            --headless \
            --editor \
            --quit \
            --path .

      - name: Export Android APK
        shell: bash
        run: |
          mkdir -p build

          "$GODOT_BIN" \
            --headless \
            --verbose \
            --path . \
            --export-debug "Android" \
            "build/OxRacing-debug.apk"

      - name: Verify APK
        shell: bash
        run: |
          if [ ! -f "build/OxRacing-debug.apk" ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi

          ls -lh build/OxRacing-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OxRacing-debug-apk
          path: build/OxRacing-debug.apk
          if-no-files-found: error
          retention-days: 14
