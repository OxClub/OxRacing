name: Build OxRacing Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.5.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CI dependencies
        run: |
          apt-get update
          apt-get install -y curl unzip fontconfig

      - name: Show versions
        run: |
          godot --version
          java -version || true
          curl --version
          unzip -v | head -n 2

      - name: Install Godot Android export templates
        run: |
          mkdir -p /github/home/.local/share/godot/export_templates/4.5.1.stable

          curl -fL \
            "https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz" \
            -o /tmp/templates.tpz

          mkdir -p /tmp/godot_templates

          unzip -o /tmp/templates.tpz \
            -d /tmp/godot_templates

          find /tmp/godot_templates -maxdepth 3 -type f

          cp /tmp/godot_templates/templates/android_debug.apk \
            /github/home/.local/share/godot/export_templates/4.5.1.stable/android_debug.apk

          cp /tmp/godot_templates/templates/android_release.apk \
            /github/home/.local/share/godot/export_templates/4.5.1.stable/android_release.apk

          ls -lh /github/home/.local/share/godot/export_templates/4.5.1.stable/

      - name: Check Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          which java
          java -version

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -n "$ANDROID_HOME" ]; then
            ls -la "$ANDROID_HOME" || true
          fi

      - name: Validate Godot project
        run: |
          godot --headless \
            --editor \
            --quit \
            --path .

      - name: Build Android APK
        run: |
          mkdir -p build

          godot --headless \
            --path . \
            --export-debug "Android" \
            build/OxRacing-debug.apk

      - name: Verify APK
        run: |
          test -f build/OxRacing-debug.apk
          ls -lh build/OxRacing-debug.apk
          file build/OxRacing-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OxRacing-debug-apk
          path: build/OxRacing-debug.apk
          if-no-files-found: error
          retention-days: 14
