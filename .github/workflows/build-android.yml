name: Build OxRacing Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build OxRacing Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip fontconfig openjdk-17-jdk

      - name: Configure Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

          "$JAVA_HOME_17_X64/bin/java" -version

      - name: Locate Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDK=""

          for candidate in \
            "$ANDROID_HOME" \
            "$ANDROID_SDK_ROOT" \
            "$RUNNER_TOOL_CACHE"/android-sdk/* \
            "$HOME"/android-sdk \
            "/usr/local/lib/android/sdk" \
            "/opt/android-sdk"
          do
            if [ -n "$candidate" ] && [ -d "$candidate" ]; then
              SDK="$candidate"
              break
            fi
          done

          if [ -z "$SDK" ]; then
            echo "Searching filesystem for sdkmanager..."
            SDKMANAGER_PATH="$(find "$RUNNER_TOOL_CACHE" "$HOME" /usr/local /opt \
              -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"

            if [ -n "$SDKMANAGER_PATH" ]; then
              SDK="$(dirname "$(dirname "$(dirname "$SDKMANAGER_PATH")")")"
            fi
          fi

          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then
            echo "ERROR: Android SDK could not be located."
            echo "Searching for sdkmanager:"
            find "$RUNNER_TOOL_CACHE" "$HOME" /usr/local /opt \
              -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          echo "Using Android SDK: $SDK"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          if [ -d "$SDK/cmdline-tools/latest/bin" ]; then
            echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          fi

          if [ -d "$SDK/cmdline-tools/bin" ]; then
            echo "$SDK/cmdline-tools/bin" >> "$GITHUB_PATH"
          fi

      - name: Locate sdkmanager
        shell: bash
        run: |
          SDKMANAGER=""

          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null || true
            exit 1
          fi

          echo "sdkmanager=$SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Install Android SDK components
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2"

          echo "Installed Android build tools:"
          ls -la "$ANDROID_HOME/build-tools"

      - name: Download Godot
        shell: bash
        run: |
          curl -fL \
            "https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip

          mkdir -p "$HOME/godot"
          unzip -o /tmp/godot.zip -d "$HOME/godot"

          GODOT_BIN="$HOME/godot/Godot_v4.5.1-stable_linux.x86_64"

          if [ ! -f "$GODOT_BIN" ]; then
            echo "ERROR: Godot executable not found:"
            find "$HOME/godot" -maxdepth 2 -type f -print
            exit 1
          fi

          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"
          "$GODOT_BIN" --version

      - name: Install Godot Android templates

        run: |
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.5.1.stable"

          mkdir -p "$TEMPLATE_DIR"

          curl -fL \
            "https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz" \
            -o /tmp/templates.tpz

          mkdir -p /tmp/godot_templates

          unzip -o /tmp/templates.tpz -d /tmp/godot_templates

          cp /tmp/godot_templates/templates/android_debug.apk \
            "$TEMPLATE_DIR/android_debug.apk"

          cp /tmp/godot_templates/templates/android_release.apk \
            "$TEMPLATE_DIR/android_release.apk"

          ls -lh "$TEMPLATE_DIR"

      - name: Configure Godot
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF2
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/java_sdk_path = "$JAVA_HOME_17_X64"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          export/android/shutdown_adb_on_exit = true
          EOF2

          echo "Godot Android settings:"
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Validate project



        run: |
          "$GODOT_BIN" \
            --headless \
            --editor \
            --quit \
            --path .

      - name: Export Android APK
        shell: bash
        run: |
          mkdir -p build

          export ANDROID_HOME="$ANDROID_HOME"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export JAVA_HOME="$JAVA_HOME_17_X64"

          echo "Export environment:"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "JAVA_HOME=$JAVA_HOME"

          "$GODOT_BIN" \
            --headless \
            --path . \
            --export-debug "Android" \
            "build/OxRacing-debug.apk"

      - name: Verify APK


        run: |
          test -f build/OxRacing-debug.apk
          ls -lh build/OxRacing-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OxRacing-debug-apk
          path: build/OxRacing-debug.apk
          if-no-files-found: error
          retention-days: 14
