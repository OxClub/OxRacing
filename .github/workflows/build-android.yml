name: Build OxRacing Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build OxRacing Android APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            unzip \
            fontconfig \
            openjdk-17-jdk

      - name: Configure Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"

          "$JAVA_HOME_17_X64/bin/java" -version

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME"

          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          sdkmanager --list_installed

      - name: Download Godot
        run: |
          curl -fL \
            "https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip

          mkdir -p "$HOME/godot"

          unzip -o /tmp/godot.zip \
            -d "$HOME/godot"

          find "$HOME/godot" -maxdepth 2 -type f -name godot

          GODOT_BIN="$(find "$HOME/godot" -type f -name godot | head -n 1)"

          chmod +x "$GODOT_BIN"

          echo "GODOT_BIN=$GODOT_BIN" >> "$GITHUB_ENV"

          "$GODOT_BIN" --version

      - name: Download Godot Android export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.5.1.stable"

          curl -fL \
            "https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz" \
            -o /tmp/templates.tpz

          mkdir -p /tmp/godot_templates

          unzip -o /tmp/templates.tpz \
            -d /tmp/godot_templates

          cp /tmp/godot_templates/templates/android_debug.apk \
            "$HOME/.local/share/godot/export_templates/4.5.1.stable/android_debug.apk"

          cp /tmp/godot_templates/templates/android_release.apk \
            "$HOME/.local/share/godot/export_templates/4.5.1.stable/android_release.apk"

          ls -lh "$HOME/.local/share/godot/export_templates/4.5.1.stable"

      - name: Create Godot editor settings
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF2
          [gd_resource type="EditorSettings" format=3]

          [resource]

          export/android/java_sdk_path = "$JAVA_HOME_17_X64"
          EOF2

          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Validate project
        run: |
          "$GODOT_BIN" \
            --headless \
            --editor \
            --quit \
            --path .

      - name: Export Android APK
        run: |
          mkdir -p build

          "$GODOT_BIN" \
            --headless \
            --path . \
            --export-debug "Android" \
            build/OxRacing-debug.apk

      - name: Verify APK
        run: |
          test -f build/OxRacing-debug.apk
          ls -lh build/OxRacing-debug.apk
          file build/OxRacing-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OxRacing-debug-apk
          path: build/OxRacing-debug.apk
          if-no-files-found: error
          retention-days: 14
