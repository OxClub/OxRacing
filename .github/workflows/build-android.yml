name: Build OxRacing Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.5.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Godot version
        run: godot --version

      - name: Validate project
        run: |
          godot --headless --editor --quit --path .

      - name: Build Android APK
        run: |
          mkdir -p build
          godot --headless \
            --path . \
            --export-debug "Android" \
            build/OxRacing-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OxRacing-debug-apk
          path: build/OxRacing-debug.apk
          if-no-files-found: error
          retention-days: 14
