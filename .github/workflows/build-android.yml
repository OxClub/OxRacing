name: Build OxRacing Android

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build OxRacing Android APK
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.5.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y curl unzip fontconfig

      - name: Configure Java
        shell: bash
        run: |
          JAVA_BIN="$(readlink -f "$(command -v java)")"
          JAVA_HOME="$(dirname "$(dirname "$JAVA_BIN")")"

          echo "Detected Java:"
          "$JAVA_HOME/bin/java" -version

          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "GODOT_JAVA_PATH=$JAVA_HOME" >> "$GITHUB_ENV"

      - name: Configure Android SDK
        shell: bash
        run: |
          if [ -d "/opt/android-sdk" ]; then
            echo "ANDROID_HOME=/opt/android-sdk" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> "$GITHUB_ENV"
          elif [ -d "/usr/local/android-sdk" ]; then
            echo "ANDROID_HOME=/usr/local/android-sdk" >> "$GITHUB_ENV"
            echo "ANDROID_SDK_ROOT=/usr/local/android-sdk" >> "$GITHUB_ENV"
          fi

          echo "ANDROID_HOME=${ANDROID_HOME:-not-found}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-not-found}"

      - name: Install Godot Android export templates
        shell: bash
        run: |
          TEMPLATE_DIR="/github/home/.local/share/godot/export_templates/4.5.1.stable"

          mkdir -p "$TEMPLATE_DIR"

          curl -fL \
            "https://github.com/godotengine/godot/releases/download/4.5.1-stable/Godot_v4.5.1-stable_export_templates.tpz" \
            -o /tmp/templates.tpz

          mkdir -p /tmp/godot_templates
          unzip -o /tmp/templates.tpz -d /tmp/godot_templates

          cp /tmp/godot_templates/templates/android_debug.apk \
            "$TEMPLATE_DIR/android_debug.apk"

          cp /tmp/godot_templates/templates/android_release.apk \
            "$TEMPLATE_DIR/android_release.apk"

          ls -lh "$TEMPLATE_DIR"

      - name: Configure Godot editor settings
        shell: bash
        run: |
          mkdir -p /github/home/.config/godot

          cat > /github/home/.config/godot/editor_settings-4.tres <<EOF2
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF2

          echo "Godot Java SDK path configured:"
          cat /github/home/.config/godot/editor_settings-4.tres

      - name: Validate project
        run: |
          godot \
            --headless \
            --editor \
            --quit \
            --path .

      - name: Export Android APK
        run: |
          mkdir -p build

          godot \
            --headless \
            --path . \
            --export-debug "Android" \
            build/OxRacing-debug.apk

      - name: Verify APK
        run: |
          test -f build/OxRacing-debug.apk
          ls -lh build/OxRacing-debug.apk
          file build/OxRacing-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OxRacing-debug-apk
          path: build/OxRacing-debug.apk
          if-no-files-found: error
          retention-days: 14
